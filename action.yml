name: go-release-manager
description: Computes (and optionally creates) the next SemVer tag from Conventional Commits.
author: Fabio Dorneles
branding:
  icon: tag
  color: blue

inputs:
  version:
    description: go-release-manager version to install (e.g. v1.1.1), "latest" or "source" (builds the Action's own code; needs Go).
    default: latest
  create:
    description: '"true" creates and pushes the tag; otherwise it only computes.'
    default: "false"
  pre-release:
    description: Pre-release channel (e.g. beta, rc).
    default: ""
  release-as:
    description: Forces this version (vX.Y.Z) instead of the computed one.
    default: ""
  ref:
    description: Commit or branch to analyze and tag (default HEAD).
    default: ""
  working-directory:
    description: Git repository to analyze.
    default: "."
  token:
    description: Token to download the release and, with create, push the tag.
    default: ${{ github.token }}

outputs:
  next:
    description: Next version (empty when there is no release).
    value: ${{ steps.run.outputs.next }}
  previous:
    description: Latest stable version.
    value: ${{ steps.run.outputs.previous }}
  increment:
    description: None, Patch, Minor or Major.
    value: ${{ steps.run.outputs.increment }}
  created:
    description: '"true" when the tag was created and pushed.'
    value: ${{ steps.run.outputs.created }}
  ref:
    description: Commit (short) where the tag was or would be created.
    value: ${{ steps.run.outputs.ref }}
  forced:
    description: '"true" when the version came from release-as.'
    value: ${{ steps.run.outputs.forced }}

runs:
  using: composite
  steps:
    - name: Install go-release-manager
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        repo=fabiodrneles/go-release-manager
        dir="$RUNNER_TEMP/go-release-manager"
        mkdir -p "$dir"
        if [ "$VERSION" = source ]; then
          (cd "$GITHUB_ACTION_PATH" && go build -o "$dir/go-release-manager" .)
          echo "$dir" >> "$GITHUB_PATH"
          exit 0
        fi
        if [ "$VERSION" = latest ]; then
          VERSION=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
        fi
        case "$RUNNER_OS" in
          Linux) os=Linux ext=tar.gz ;;
          macOS) os=Darwin ext=tar.gz ;;
          Windows) os=Windows ext=zip ;;
          *) echo "unsupported OS: $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=x86_64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        asset="go-release-manager_${VERSION#v}_${os}_${arch}.${ext}"
        gh release download "$VERSION" -R "$repo" -p "$asset" -p checksums.txt -D "$dir" --clobber
        sum=sha256sum
        command -v sha256sum >/dev/null || sum="shasum -a 256"
        (cd "$dir" && grep " $asset\$" checksums.txt | $sum -c -)
        if [ "$ext" = zip ]; then
          if command -v unzip >/dev/null; then unzip -o -q "$dir/$asset" -d "$dir"
          else pwsh -NoProfile -Command "Expand-Archive -Force '$dir/$asset' '$dir'"; fi
        else
          tar xzf "$dir/$asset" -C "$dir"
        fi
        echo "$dir" >> "$GITHUB_PATH"

    - name: Compute the next version
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        CREATE: ${{ inputs.create }}
        CHANNEL: ${{ inputs.pre-release }}
        RELEASE_AS: ${{ inputs.release-as }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        args=(create --output json)
        [ "$CREATE" = true ] || args+=(--dry-run)
        [ -z "$CHANNEL" ] || args+=(--pre-release "$CHANNEL")
        [ -z "$RELEASE_AS" ] || args+=(--release-as "$RELEASE_AS")
        [ -z "$REF" ] || args+=(--ref "$REF")
        json=$(go-release-manager "${args[@]}")
        echo "$json"
        for k in next previous increment created ref forced; do
          # "// empty" would also drop false, so convert explicitly.
          echo "$k=$(jq -r ".$k | if . == null then \"\" else tostring end" <<<"$json")" >> "$GITHUB_OUTPUT"
        done
