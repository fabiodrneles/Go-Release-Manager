name: sdd CI summary

# Quando o CI de um PR termina, mantém UM comentário de resumo no PR (spec 015
# FR-3 do sdd-kit): uma linha por check e o fim do log das falhas; vira "verde"
# quando o CI passa. Roda com os scripts da branch padrão (workflow_run) e só usa
# o número e o SHA do evento: nunca faz checkout nem executa código do PR (NFR-1).
# Desligue com a variável do repositório SDD_ENGINE=off.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

jobs:
  summary:
    name: Resumir o CI no PR
    runs-on: ubuntu-latest
    if: >-
      vars.SDD_ENGINE != 'off' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Comentar o resumo
        env:
          GH_TOKEN: ${{ github.token }}
          SDD_ENGINE: ${{ vars.SDD_ENGINE }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: sh scripts/sdd-ci-comment.sh --repo "$GITHUB_REPOSITORY" --pr "$PR" --sha "$SHA"
