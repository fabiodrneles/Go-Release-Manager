name: sdd-kit sync

# Abre (ou atualiza) um PR com a última versão dos arquivos do sdd-kit
# (spec 005 do sdd-kit). Requer em Settings → Actions → General:
# "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 6 * * 1" # segundas, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sincronizar com o sdd-kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Atualizar arquivos gerenciados
        run: sh scripts/sdd-sync.sh --summary "$RUNNER_TEMP/sdd-sync.md"
      - name: Abrir ou atualizar o PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada a sincronizar."
            exit 0
          fi
          branch=sdd-kit/sync
          version="$(jq -r .version .sdd-kit.json)"
          title="chore: sync sdd-kit files to $version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A
          git commit -m "$title"
          git push --force origin "$branch"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/sdd-sync.md"
          else
            gh pr create --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/sdd-sync.md"
          fi
